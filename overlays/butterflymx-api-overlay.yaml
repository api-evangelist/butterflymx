overlay: 1.0.0
info:
  title: API Evangelist enhancements for ButterflyMX API
  version: 1.0.0
extends: openapi/butterflymx-api-openapi.yml
x-generated: '2026-08-08'
x-method: generated
x-rationale:
- The published ButterflyMX OpenAPI declares ZERO operationIds across all 57 operations, so no SDK generator, Arazzo workflow,
  MCP tool or agent skill can address an operation by name. This overlay assigns one per operation, derived from that operation's
  own summary — nothing the provider published is renamed.
- The spec declares a Bearer securityScheme and applies it per-operation, but sets no root-level security object.
- The spec uses 14 tags and declares none of them at the document root.
- openapi/_original/butterflymx-api-openapi.json is never mutated; it stays exactly as harvested.
actions:
- target: $.info
  description: Record the API Evangelist enrichment pass and fill the description/contact metadata the spec omits.
  update:
    description: 'Public REST API for the ButterflyMX property-access platform: buildings, units, tenants, access groups,
      access points, devices, permanent access tools (PINs and RFID tags), keychains and virtual keys for visitor passes,
      programmatic door release, webhook integrations, and access and call logs.'
    contact:
      name: ButterflyMX Developer Hub
      url: https://apidocs.butterflymx.com/
    x-apievangelist-enriched: '2026-08-08'
    x-apievangelist-source: https://apidocs.butterflymx.com/reference/get_v4-buildings-1
- target: $
  description: Apply the Bearer scheme at the document root — the spec declares it and uses it per-operation but sets no
    root security.
  update:
    security:
    - Bearer: []
- target: $
  description: Declare the 14 tags the operations already reference but the document never defines.
  update:
    tags:
    - name: Access Logs
      description: Door release and entry events for a building.
    - name: Access Points
      description: One or more doors, gates or ramps controlled as a single entity.
    - name: Access Tools
      description: 'Permanent access credentials: PINs and RFID tags.'
    - name: Access groups
      description: Grouping of tenants and units for scheduled access.
    - name: Building Integrations
      description: Building-scoped webhook subscriptions.
    - name: Buildings
      description: Physical buildings containing units and devices.
    - name: Calls
      description: Historical video call records.
    - name: Devices
      description: 'Installed hardware: intercoms, keypads, smart locks.'
    - name: Door Release Requests
      description: Programmatic door release (swipe-to-open).
    - name: Keychains
      description: Configuration objects for temporary virtual keys.
    - name: Tenant Integrations
      description: Tenant-scoped webhook subscriptions.
    - name: Tenants
      description: People living in a unit.
    - name: Units
      description: Physical spaces within a building.
    - name: Virtual Keys
      description: Temporary guest access credentials issued from a keychain.
