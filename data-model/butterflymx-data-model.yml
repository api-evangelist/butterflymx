note: >-
  Derived from the response examples embedded in the ButterflyMX OpenAPI, because the spec ships
  `components.schemas` EMPTY — all 57 operations inline their payloads as examples with no named, reusable
  schema. Field lists below are exactly the keys the provider's own examples return; relationships are the
  `*_id` / `*_ids` reference fields those payloads carry. Nothing is inferred beyond what the examples show.
root: building
entities:
- name: building
  collection: /v4/buildings
  fields: [id, name, address, time_zone, created_at, updated_at]
  sub_resources:
  - /v4/buildings/{id}/capabilities
  - /v4/buildings/{building_id}/units
  - /v4/buildings/{building_id}/access_logs
  - /v4/buildings/{building_id}/calls
  - /v4/buildings/{building_id}/integrations
- name: unit
  collection: /v4/units
  fields: [id, label, floor, building_id, created_at, updated_at]
- name: tenant
  collection: /v4/tenants
  fields: [id, first_name, last_name, full_name, email, building_id, building_name, building_timezone,
    unit, contact_preference, notification_preference, registration_status, invitation, inactive_after,
    created_at, updated_at]
- name: access_point
  collection: /v4/access_points
  fields: [id, name, building_id, device_ids, open_hours, created_at, updated_at]
- name: device
  collection: /v4/devices
  fields: [id, name, type, model, serial_number, building_id, created_at, updated_at]
  types_observed: [smart_lock]
- name: access_group
  collection: /v4/access_groups
  fields: [id, name, building_id, tenants_ids, units_ids, created_at, updated_at]
- name: access_tool
  collection: /v4/access_tools
  fields: [id, type, code, tenant_id, building_id, created_at, updated_at]
  subtypes:
  - name: pin
    create: POST /v4/access_tools/pins
    update: PUT /v4/access_tools/pins/{id}
    constraint: one PIN per tenant; complexity rules reject sequences and repeated digits (4-digit legacy exempt)
  - name: rfid_tag
    create: POST /v4/access_tools/rfid_tags
    constraint: immutable — delete and re-create instead of updating
- name: keychain
  collection: /v4/keychains
  fields: [id, name, type, tenant_id, unit_id, building_id, access_point_ids, device_ids, virtual_key_ids,
    starts_at, ends_at, created_at, updated_at]
  subtypes:
  - name: custom
    create: POST /v4/keychains/custom
  - name: one_time
    create: POST /v4/keychains/one_time
  - name: delivery_pass
    create: POST /v4/keychains/delivery_pass
  - name: recurring
    create: POST /v4/keychains/recurring
    extra_fields: [start_date, end_date, time_from, time_to, weekdays]
- name: virtual_key
  collection: /v4/virtual_keys
  fields: [id, name, keychain_id, building_id, email, sms_number, pin_code, qr_code_url, instructions_url,
    sent_at, first_used_at, last_used_at, usage_count, created_at, updated_at]
- name: door_release_request
  collection: /v4/door_release_requests
  fields: [id, guid, tenant_id, access_point_id, device_id, release_method, created_at, updated_at]
  note: Write-only action resource — the API's single physical side effect.
- name: access_log
  collection: /v4/buildings/{building_id}/access_logs
  fields: [id, logged_at, access_point, unit, tenant_id, name, entry_method, release_status, release_type,
    image_url]
- name: call
  collection: /v4/buildings/{building_id}/calls
  fields: [id, logged_at, building_id, device, unit, recipient, notification_type, status, image_url]
- name: integration
  collection: /v4/buildings/{building_id}/integrations, /v4/tenants/{tenant_id}/integrations
  fields: [type, attributes.integrator, attributes.configuration.url, attributes.configuration.method,
    attributes.bindings]
  note: The webhook subscription resource. See asyncapi/butterflymx-webhooks.yml.
- name: schedule
  collection: /v4/access_points/{id}/schedules
  fields: [id, from, to, weekdays]
- name: capability
  collection: /v4/buildings/{id}/capabilities
  fields: [delivery_pass_enabled, delivery_pickup_pins_enabled, user_photo_required]
