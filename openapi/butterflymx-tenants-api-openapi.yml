                    unit_id: 843107216
              unauthorized:
                summary: unauthorized
                value:
                  tenant:
                    user_attributes:
                      first_name: Foo
                      last_name: Bar
                      email: example@test.com
                    sync: true
                    qr_key_enabled: true
                    delivery_pass_enabled: 'true'
                    swipe_to_open_enabled: 'true'
