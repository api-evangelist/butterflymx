                    virtual_fob_entry_enabled: 'true'
                    active_at: '2026-06-18T15:12:26Z'
                    inactive_at: '2026-06-20T15:12:26Z'
                    unit_id: 843107216
                    user_panel_config_attributes:
                      display_name_strategy: first_name_and_last_name
                      display_only_on_search: false
