            schema:
              type: object
              properties:
                tenant:
                  type: object
                  properties:
                    qr_key_enabled:
                      type: boolean
                    delivery_pass_enabled:
                      type: boolean
                    swipe_to_open_enabled:
                      type: boolean
                    active_at:
                      type: string
                      format: date-time
                    inactive_at:
                      type: string
                      format: date-time
                    virtual_fob_entry_enabled:
                      type: boolean
                    unit_id:
                      type: integer
                    user_attributes:
                      type: object
                      properties:
                        email:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        contact_preference:
                          type: string
                          enum:
                          - mobile_app
                          - phone_call
                        sms_contact_attributes:
                          type: object
                          properties:
                            phone_number:
                              type: string
                        backup_contact_attributes:
                          type: object
                          properties:
                            phone_number:
                              type: string
                      required:
                      - email
                      - first_name
                      - last_name
                      additionalProperties: false
                    user_panel_config_attributes:
                      type: object
                      properties:
                        display_name_strategy:
                          type: string
                          example:
                          - first_name_and_last_name
                          - last_name_and_first_name
                          - first_name_initial_and_last_name
                          - first_name_and_last_name_initial
                          - last_name_and_first_name_initial
                          - anonymous
                        display_name:
                          type: string
                        display_only_on_search:
                          type: boolean
                        display_first_name:
                          type: boolean
                        display_last_name:
                          type: boolean
                      additionalProperties: false
                  required:
                  - first_name
                  - last_name
                  - email
                  - unit_id
                  - active_at
              required:
              - tenant
            examples:
              tenant created:
                summary: tenant created
                value:
                  tenant:
                    user_attributes:
                      first_name: Foo
                      last_name: Bar
                      email: example@test.com
                      sms_contact_attributes:
