  /v4/buildings/{building_id}/calls/{id}:
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: integer
    - name: building_id
      in: path
      description: id
      required: true
      schema:
        type: integer
    get:
      summary: show call
      tags:
      - Calls
      security:
      - Bearer: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              examples:
                successful:
                  value:
                    data:
                      id: 400494507
                      building_id: 577696272
                      logged_at: '2026-06-14T15:12:19Z'
                      notification_type: visitor
                      recipient:
                        id: 377389742
                        type: Tenant
                      unit:
                        id: 474917539
                      device:
                        id: 708353660
                        name: Main Entrance
                      status: initializing
                      image_url: http://user.butterflymx.localhost/uploads/store/1840652b7ab4216e2079a71a87155ea6.png
        '401':
          description: unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - field: base
                      code: unauthorized
                      messages: Unauthorized
        '404':
          description: not found
          content:
            application/json:
              examples:
                not found:
                  value:
                    errors:
                    - field: base
                      code: not_found
                      message: Resource not found
components:
  securitySchemes:
    Bearer:
      description: JWT necessary to make API calls
      type: apiKey
      name: Authorization
      in: header
