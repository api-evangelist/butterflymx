openapi: 3.2.0
info:
  title: ButterflyMX Calls API
  version: v4
servers:
- description: Production
  url: https://api.butterflymx.com
- description: Sandbox
  url: https://api.na.sandbox.butterflymx.com
- description: Other environment
  url: https://{environment_name}.butterflymx.com
  variables:
    environment_name:
      default: foobar
tags:
- name: Calls
paths:
  /v4/buildings/{building_id}/calls:
    get:
      summary: list calls
      tags:
      - Calls
      security:
      - Bearer: []
      parameters:
      - name: building_id
        in: path
        description: id of the building
        required: true
        schema:
          type: integer
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
        description: requested page
        example: 3
      - name: per
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: page size
        example: 50
      - name: q[logged_at_gteq]
        in: query
        example: 2026-06-17 15:12:19 UTC
        schema:
          type: string
      - name: q[logged_at_lteq]
        in: query
        example: 2026-06-17 15:12:19 UTC
        schema:
          type: string
      - name: q[notification_type_eq]
        in: query
        example: visitor
        schema:
          type: string
      - name: q[origin_eq]
        in: query
        example: 123
        schema:
          type: string
      - name: q[unit_label_or_user_full_name_start]
        in: query
        example: Foo
        schema:
          type: string
      responses:
        '200':
          description: fetch all access logs
          content:
            application/json:
              examples:
