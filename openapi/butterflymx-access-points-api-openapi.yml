                      name: Front door
                      updated_at: '2026-06-17T15:12:20Z'
                      building_id: 577696272
                      device_ids:
                      - 708353660
                      - 408919060
                      open_hours: []
                    page_info:
                      current_page: 1
                      total_pages: 1
                      total_item_count: 9
                      page_item_count: 9
                      page_size: 50
                      next_page: null
                      prev_page: null
                      first_page: true
                      last_page: true
        '401':
          description: unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - field: base
                      code: unauthorized
                      messages: Unauthorized
  /v4/access_points/{id}:
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: integer
    get:
      summary: show access point
      tags:
      - Access Points
      security:
      - Bearer: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              examples:
                successful:
                  value:
                    data:
                      created_at: '2026-06-17T15:12:20Z'
                      id: 239674119
                      name: Front Entrance
                      updated_at: '2026-06-17T15:12:20Z'
                      building_id: 505753268
                      device_ids:
                      - 127952958
                      open_hours: []
        '401':
          description: unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - field: base
                      code: unauthorized
                      messages: Unauthorized
  /v4/access_points/{id}/schedules:
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: integer
    - name: page
      in: query
      schema:
        type: integer
        minimum: 0
      description: requested page
      example: 3
    - name: per
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: page size
      example: 50
    get:
      summary: show schedules
      tags:
      - Access Points
      security:
      - Bearer: []
      description: 'Times during which this access point can be used by current user.

        '
      responses:
        '200':
          description: successful
          content:
            application/json:
              examples:
                successful:
                  value:
                    data:
                    - id: 83723449
                      weekdays:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                      - sat
                      - sun
                      from: 00:00
                      to: 00:00
                    page_info:
                      current_page: 1
                      total_pages: 1
                      total_item_count: 1
                      page_item_count: 1
                      page_size: 50
                      next_page: null
                      prev_page: null
                      first_page: true
                      last_page: true
        '401':
          description: unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - field: base
                      code: unauthorized
                      messages: Unauthorized
components:
  securitySchemes:
    Bearer:
      description: JWT necessary to make API calls
      type: apiKey
      name: Authorization
      in: header
