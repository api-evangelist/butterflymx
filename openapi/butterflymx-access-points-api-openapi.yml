                      updated_at: '2026-06-17T15:12:20Z'
                      building_id: 505753268
                      device_ids:
                      - 127952958
                      open_hours: []
                    - created_at: '2026-06-17T15:12:20Z'
                      id: 834074842
                      name: Main gate
                      updated_at: '2026-06-17T15:12:20Z'
                      building_id: 750989427
                      device_ids: []
