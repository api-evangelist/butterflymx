  /v4/keychains:
    get:
      summary: list keychains
      tags:
      - Keychains
      description: "**Keychains** and **Virtual Keys** provide a mechanism for people to\ngrant temporary access to a building,\
        \ unit, access points or\nkey lockers.\n\nA **Keychain** is the configuration object for one or more\n**Virtual Keys**.\
        \ It holds the duration, owner, and other\ninformation about the Virtual Keys attached to it. While the Virtual\n\
        Keys contain the recipient information and usage statistics.\n\nThere are multiple types of Keychains available that\
        \ provide different\naccess scheduling mechanisms for the Virtual Keys attached to them.\n\n* **Custom** keychains\
        \ grant access from a given start time and date,\n    to an end time and date.\n* **Recurring** keychains grant access\
        \ on a recurring schedule,\n    specified by a list of weekdays on which the key is active, a start\n    and an end\
        \ time. Additionally a start and end date must be specified.\n* **One Time** keychains are alike **custom keychains**\
        \ but grant the\n    recipient access only once. *After the key is used it can be re-used\n    for an additional 15min\
        \ after which it expires.*\n* **Delivery Pass** keychains are alike **one time keychains** but have\n    a much shorter\
        \ grace period of 5min after the key is used. And they\n    always hold exactly one Virtual Key. Not much can be specified\
        \ or\n    updated on them. Their main purpose is to provide a quick way to\n    generate a virtual key and share it\
        \ with a delivery person.\n"
      security:
      - Bearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
        description: requested page
        example: 3
      - name: per
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: page size
        example: 50
      - name: q[name_eq]
        in: query
        description: filter by exact match on name (case insensitive)
        example: Party
        schema:
          type: string
      - name: q[name_start]
        in: query
        description: filter by name starts with (case insensitive)
        example: Par
        schema:
          type: string
      - name: q[tenant_id_eq]
        in: query
        description: filter by exact match on tenant id
        example: 123
        schema:
          type: string
      - name: q[tenant_id_in][]
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
        description: filter by tenant id in list
        example:
        - 123
        - 456
      - name: q[unit_id_eq]
        in: query
        description: filter by exact match on unit id
        example: 123
        schema:
          type: string
      - name: q[unit_id_in][]
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
        description: filter by unit id in list
        example:
        - 123
        - 456
      - name: q[starts_at_gteq]
        in: query
        description: filter by starts at greater than or equal to
        example: '2020-01-01T00:00:00Z'
        schema:
          type: string
      - name: q[starts_at_lteq]
        in: query
        description: filter by starts at less than or equal to
        example: '2020-01-01T00:00:00Z'
        schema:
          type: string
      - name: q[ends_at_gteq]
        in: query
        description: filter by ends at greater than or equal to
        example: '2020-01-01T00:00:00Z'
        schema:
          type: string
      - name: q[ends_at_lteq]
        in: query
        description: filter by ends at less than or equal to
        example: '2020-01-01T00:00:00Z'
        schema:
          type: string
      - name: q[building_id_eq]
        in: query
        description: filter by exact match on building id
        example: 123
        schema:
          type: string
      - name: q[building_id_in][]
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
        description: filter by building id in list
        example:
        - 123
        - 456
      - name: q[id_in][]
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
        description: filter by id in list
        example:
        - 123
        - 456
      responses:
        '200':
          description: fetch all keychains that your user can see
