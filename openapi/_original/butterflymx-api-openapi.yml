              examples:
                created:
                  value:
                    data:
                      created_at: '2026-06-17T15:12:21Z'
                      id: 989034171
                      updated_at: '2026-06-17T15:12:21Z'
                      code: E66CBDF31EAB570792CC
                      type: rfid_tag
                      building_id: 577696272
                      tenant_id: 377389742
        '422':
          description: unprocessable content
          content:
            application/json:
              examples:
                unprocessable content:
                  value:
                    errors:
                    - field: item.identifier
                      message: can't be blank
                      code: blank
                    - field: item.identifier
                      message: Unrecognized character. The fobs, cards, and tags do not accept special characters or letters
                        outside of a-f
                      code: invalid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  example: C97FBE9BAFDD4BAD67ED
                tenant_id:
                  type: integer
                  example: 123
              required:
              - tenant_id
              additionalProperties: false
            examples:
              created:
                summary: created
                value:
                  rfid_tag:
                    identifier: E66CBDF31EAB570792CC
                    tenant_id: 377389742
              unprocessable content:
                summary: unprocessable content
                value:
                  rfid_tag:
                    identifier: ''
                    tenant_id: 377389742
  /v4/access_tools:
    get:
      summary: list access tools
