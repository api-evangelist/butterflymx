            application/json:
              examples:
                unauthorized:
                  value:
                    errors:
                    - field: base
                      code: unauthorized
                      messages: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                door_release_request:
                  type: object
                  properties:
                    access_point_id:
                      type: integer
                      nullable: true
                    device_id:
                      type: integer
                      nullable: true
                    tenant_id:
                      type: integer
                  required:
                  - tenant_id
                  oneOf:
                  - required:
                    - access_point_id
                  - required:
                    - device_id
                  additionalProperties: false
              required:
              - door_release_request
            examples:
              open a specific access point:
