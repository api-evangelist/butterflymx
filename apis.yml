apis:
- name: ButterflyMX API
  description: >-
    Public REST API (v4) for the ButterflyMX property-access platform. Covers buildings, units, tenants,
    access groups, access points, devices, access tools (PINs and RFID tags), keychains and virtual keys for
    visitor passes, door-release requests, building and tenant webhook integrations, and access and call logs.
    JSON over HTTPS with a `data` envelope, `page`/`per` pagination and Ransack-style `q[...]` filter
    parameters. Authorization is an OAuth 2.0 bearer token sent in the `Authorization` header.
  humanURL: https://apidocs.butterflymx.com/reference/get_v4-buildings-1
  baseURL: https://api.butterflymx.com
