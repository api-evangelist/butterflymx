aid: butterflymx
name: ButterflyMX
description: >-
  ButterflyMX is a property-access technology company whose smart video intercoms, keypads, smart locks,
  elevator controls, vehicle-access readers, package rooms and front-desk stations are installed in more than
  20,000 multifamily, commercial, gated-community, student-housing and senior-living buildings. Its public
  ButterflyMX API (v4) exposes the same access-control core to partners and property-technology platforms:
  buildings, units, tenants, access points, devices, access groups, permanent access tools (PINs and RFID
  tags), keychains and virtual keys for visitor passes, door-release requests for programmatic swipe-to-open,
  and access and video-call logs. Real-time delivery is handled by building- and tenant-scoped webhook
  integrations, and native iOS and Android SDKs add in-app video-call handling on top of the REST surface.
  Authorization is OAuth 2.0 authorization-code, issued by an OpenID-Connect-discoverable authorization
  server at accounts.butterflymx.com, with a full sandbox replica for pre-production testing.
image: https://butterflymx.com/wp-content/uploads/2023/10/gated-community-intercom.webp
